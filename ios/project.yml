# XcodeGen spec. Generate with:  cd ios && xcodegen generate && open Filmcase.xcodeproj
# The generated Filmcase.xcodeproj is git-ignored.
name: Filmcase

options:
  bundleIdPrefix: dev.filmcase
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Signing: set your team ONCE, outside this file, so regenerating the project keeps it.
#   Create ios/Local.xcconfig (git-ignored) containing:  DEVELOPMENT_TEAM = YOURTEAMID
#   Signing.xcconfig includes it only if it exists, so CI and fresh clones need nothing.
# DEVELOPMENT_TEAM is deliberately NOT set below: a target-level value would override the xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FilmcaseKit:
    path: FilmcaseKit

targets:
  Filmcase:
    type: application
    platform: iOS
    sources:
      # Code, assets and the rest of App/ ...
      - path: App
        excludes:
          - "Demo/Fixtures/**"
          - "Fonts/**"
      # ... and the bundled data/fonts, explicitly as resources (flattened into the bundle root,
      # which is where DemoHTTPTransport and UIAppFonts look for them).
      - path: App/Demo/Fixtures
        buildPhase: resources
      - path: App/Fonts
        buildPhase: resources
    dependencies:
      - package: FilmcaseKit
        product: FilmcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.app
        PRODUCT_NAME: Filmcase
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: .generated/Filmcase-Info.plist
      properties:
        CFBundleDisplayName: Filmcase
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "Filmcase connects to your Filmcase server on your local network."
        NSCameraUsageDescription: "Filmcase talks to your Fujifilm camera over USB-C to read and write custom slots."
        UILaunchScreen: {}
        UIAppFonts:
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - "Archivo-VariableFont_wdth,wght.ttf"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  FilmcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    # The host app already links FilmcaseKit; linking it here too would load two
    # copies at test time. XcodeGen sets TEST_HOST/BUNDLE_LOADER from the app dependency.
    dependencies:
      - target: Filmcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.app.tests
        GENERATE_INFOPLIST_FILE: YES

  FilmcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Filmcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  USBSpike:
    type: application
    platform: iOS
    sources:
      - path: Spikes/USBSpike
    dependencies:
      - package: FilmcaseKit
        product: FilmcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.usbspike
        PRODUCT_NAME: USBSpike
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: .generated/USBSpike-Info.plist
      properties:
        CFBundleDisplayName: USBSpike
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "USBSpike talks to your Fujifilm camera over USB-C to read and write custom slots."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  Filmcase:
    build:
      targets:
        Filmcase: all
        FilmcaseTests: [test]
        FilmcaseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FilmcaseTests
        - FilmcaseUITests
    archive:
      config: Release

  USBSpike:
    build:
      targets:
        USBSpike: all
    run:
      config: Debug
    archive:
      config: Release
