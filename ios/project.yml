# XcodeGen spec. Generate with:  cd ios && xcodegen generate && open Filmcase.xcodeproj
# The generated Filmcase.xcodeproj is git-ignored.
name: Filmcase

options:
  bundleIdPrefix: dev.filmcase
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Signing: set your team ONCE, outside this file, so regenerating the project keeps it.
#   Create ios/Local.xcconfig (git-ignored) containing:  DEVELOPMENT_TEAM = YOURTEAMID
#   Signing.xcconfig includes it only if it exists, so CI and fresh clones need nothing.
# DEVELOPMENT_TEAM is deliberately NOT set below: a target-level value would override the xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FilmcaseKit:
    path: FilmcaseKit

targets:
  Filmcase:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FilmcaseKit
        product: FilmcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.app
        PRODUCT_NAME: Filmcase
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: .generated/Filmcase-Info.plist
      properties:
        CFBundleDisplayName: Filmcase
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "Filmcase connects to your Filmcase server on your local network."
        NSCameraUsageDescription: "Filmcase talks to your Fujifilm camera over USB-C to read and write custom slots."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  FilmcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Filmcase
      - package: FilmcaseKit
        product: FilmcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Filmcase.app/Filmcase"
        BUNDLE_LOADER: "$(TEST_HOST)"

  USBSpike:
    type: application
    platform: iOS
    sources:
      - path: Spikes/USBSpike
    dependencies:
      - package: FilmcaseKit
        product: FilmcaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.filmcase.usbspike
        PRODUCT_NAME: USBSpike
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: .generated/USBSpike-Info.plist
      properties:
        CFBundleDisplayName: USBSpike
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "USBSpike talks to your Fujifilm camera over USB-C to read and write custom slots."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  Filmcase:
    build:
      targets:
        Filmcase: all
        FilmcaseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FilmcaseTests
    archive:
      config: Release

  USBSpike:
    build:
      targets:
        USBSpike: all
    run:
      config: Debug
    archive:
      config: Release
