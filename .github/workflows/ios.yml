name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: FilmcaseKit tests
        working-directory: ios/FilmcaseKit
        run: swift test

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build USBSpike
        working-directory: ios
        run: >
          xcodebuild build -project Filmcase.xcodeproj -scheme USBSpike
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if ".iOS-" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in runtimes[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: App unit and UI tests
        working-directory: ios
        run: >
          xcodebuild test -project Filmcase.xcodeproj -scheme Filmcase
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          -resultBundlePath "$RUNNER_TEMP/Filmcase.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Filmcase-xcresult
          path: ${{ runner.temp }}/Filmcase.xcresult
          if-no-files-found: ignore
